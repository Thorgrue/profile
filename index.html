let lang = "en";

/* Workshops cards */
const carouselTimers = [];
function renderWorkshops(){
  const c = T[lang];
  const root = document.getElementById("workshopsList");

  while(carouselTimers.length) clearInterval(carouselTimers.pop());

  root.innerHTML = workshops.map((w,wi) => `
    <article class="ws ${w.accent==='green'?'green':''}">
      <div class="ws-carousel" data-carousel="${wi}">
        <div class="ws-slides">
          ${w.photos.map((p,i)=>`
            <div class="ws-slide ${i===0?'active':''}" data-slide="${i}">
              <img src="${p.src}" alt="${w.title[lang]} — ${p.credit}" loading="lazy" width="1024" height="768" />
              ${p.href
                ? `<a class="ws-credit" href="${p.href}" target="_blank" rel="noopener">${p.credit} ↗</a>`
                : `<div class="ws-credit">${p.credit}</div>`}
            </div>`).join("")}
        </div>
        <button class="ws-nav prev" data-dir="-1" aria-label="Previous photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="ws-nav next" data-dir="1" aria-label="Next photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="ws-dots" aria-hidden="true">
          ${w.photos.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join("")}
        </div>
      </div>
      <div class="ws-body" tabindex="0">
        <h3 class="eyebrow ${w.accent==='green'?'green':''}">${w.title[lang]}</h3>
        <p class="preview">${w.body[lang].replace(/<[^>]+>/g,'').slice(0,120)}…</p>
        <span class="hint">${c.hoverHint}</span>
        <div class="ws-overlay">
          <h3 class="eyebrow ${w.accent==='green'?'green':''}">${w.title[lang]}</h3>
          <p>${w.body[lang]}</p>
          <a href="${w.link.href}" target="_blank" rel="noopener">${w.link.label}</a>
        </div>
      </div>
    </article>
  `).join("");

    // wire workshops carousels
  document.querySelectorAll(".ws-carousel").forEach(car=>{
    const slides = car.querySelectorAll(".ws-slide");
    const dots = car.querySelectorAll(".ws-dots span");
    let idx = 0;
    const go = (n)=>{
      idx = (n + slides.length) % slides.length;
      slides.forEach((s,i)=>s.classList.toggle("active", i===idx));
      dots.forEach((d,i)=>d.classList.toggle("active", i===idx));
    };
    let timer;
    const start=()=>{ timer = setInterval(()=>go(idx+1), 12000); carouselTimers.push(timer); };
    const resetTimer=()=>{ clearInterval(timer); start(); };
    car.querySelectorAll(".ws-nav").forEach(btn=>{
      btn.addEventListener("click",()=>{
        go(idx + Number(btn.dataset.dir));
        resetTimer();
      });
    });
    start();
  });
}

  testiTimer = setInterval(()=>go(idx+1), 8000);
  document.querySelectorAll(".testi-nav").forEach(btn=>{
    btn.onclick = ()=>{ go(idx + Number(btn.dataset.dir)); clearInterval(testiTimer); testiTimer = setInterval(()=>go(idx+1), 8000); };
  });
}

/* Gallery carousel (all workshop photos) */
let galleryIdx = 0, galleryTimer = null;
function renderGallery(){
  const slidesRoot = document.getElementById("gallerySlides");
  const dotsRoot = document.getElementById("galleryDots");
  const all = workshops.flatMap(w => w.photos.map(p => ({...p, workshop:w.title[lang]})));
  slidesRoot.innerHTML = all.map((p,i)=>`
    <div class="gallery-slide ${i===0?'active':''}">
      <img src="${p.src}" alt="${p.workshop} — ${p.credit}" loading="lazy" />
      <div class="gallery-caption">
        <span>${p.workshop}</span>
        ${p.href
          ? `<a href="${p.href}" target="_blank" rel="noopener">${p.credit} ↗</a>`
          : `<span class="muted">${p.credit}</span>`}
      </div>
    </div>`).join("");
  dotsRoot.innerHTML = all.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join("");
  const slides = slidesRoot.querySelectorAll(".gallery-slide");
  const dots = dotsRoot.querySelectorAll("span");
  galleryIdx = 0;
  const go = n => {
    galleryIdx = (n + slides.length) % slides.length;
    slides.forEach((s,i)=>s.classList.toggle("active", i===galleryIdx));
    dots.forEach((d,i)=>d.classList.toggle("active", i===galleryIdx));
  };
  document.querySelectorAll(".gallery-nav").forEach(btn=>{
    btn.onclick = ()=>go(galleryIdx + Number(btn.dataset.dir));
  });
  clearInterval(galleryTimer);
}

function apply(){
  const c = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if (c[k] !== undefined) el.textContent = c[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const k = el.getAttribute("data-i18n-html");
    if (c[k] !== undefined) el.innerHTML = c[k];
  });
  document.getElementById("intentions").innerHTML =
    c.intentionsList.map(li=>`<li>${li}</li>`).join("");
  document.getElementById("formatList").innerHTML =
    c.formatList.map(li=>`<li>${li}</li>`).join("");
  renderWorkshops();
  renderValue();
  renderTestimonials();
  renderFaq();
  renderGallery();
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click",()=>{
    lang = b.getAttribute("data-lang");
    document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("active", x===b));
    apply();
  });
});

function wireModal(openId, modalId, closeId){
  const modal = document.getElementById(modalId);
  document.getElementById(openId).addEventListener("click",()=>modal.classList.add("open"));
  document.getElementById(closeId).addEventListener("click",()=>modal.classList.remove("open"));
  modal.addEventListener("click",e=>{ if(e.target===modal) modal.classList.remove("open"); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape") modal.classList.remove("open"); });
}
wireModal("openImpressum","impressumModal","closeImpressum");
wireModal("openSeo","seoModal","closeSeo");
wireModal("openFaq","faqModal","closeFaq");
wireModal("openGallery","galleryModal","closeGallery");

apply();
</script>
