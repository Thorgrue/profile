  .quote{font-family:"Caveat",cursive;font-size:1.4rem;color:rgba(42,47,90,.7);margin-top:8px}
  .card-gaelle{

    .mission-text{margin:0 auto} 
  }

  .workshops-list{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:38px}
  .ws{
    position:relative;background:var(--card);border-radius:1.5rem;overflow:hidden;
    box-shadow:var(--shadow);display:grid;grid-template-columns:2fr 3fr;min-height:300px;
  }
  .ws.green{outline-color:rgba(139,201,90,.3)}

  .ws-slides{position:relative;width:100%;height:100%;min-height:260px}
  .ws-slide{
    position:absolute;inset:0;opacity:0;transition:opacity .9s ease;
  }
  .ws-slide.active{opacity:1}
  .ws-slide img{width:100%;height:100%;object-fit:cover}
  .ws-credit{

    padding:3px 8px;border-radius:6px;letter-spacing:.02em;
    opacity:.85;
  }
  .ws-nav{
    position:absolute;top:0;bottom:0;width:38%;display:flex;align-items:center;
    background:none;border:0;cursor:pointer;color:#fff;padding:0 10px;
    opacity:0;transition:opacity .25s ease;
  }

  .ws-nav svg{width:22px;height:22px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
  .ws-dots{
    position:absolute;bottom:8px;right:10px;display:flex;gap:5px;z-index:2;
  }

  .ws-dots span.active{background:#fff;transform:scale(1.3)}

  .ws-body h3{font-size:.95rem}
  .ws-body .preview{color:var(--muted);font-size:.92rem;margin:0}
  .ws-body .hint{margin-top:auto;color:var(--blue);font-size:.75rem;font-weight:500}
  .ws.green .ws-body h3,.ws.green .ws-body .hint{color:var(--green)}
  .ws-overlay{
    position:absolute;inset:0;background:rgba(200,220,241,.96);
    padding:28px 32px;display:flex;flex-direction:column;justify-content:center;gap:12px;
    opacity:0;transform:translateY(6px);transition:all .3s ease;pointer-events:none;
  }

  .ws-overlay a{color:var(--blue);font-size:.8rem;text-decoration:underline;text-underline-offset:4px;align-self:flex-start;font-weight:500}
  .ws.green .ws-overlay a{color:var(--green)}

  .impressum-btn{background:none;border:0;cursor:pointer;color:var(--blue);font:inherit;text-decoration:underline;text-underline-offset:4px;font-size:.9rem}

let lang = "en";
const carouselTimers = [];

function renderWorkshops(){
  const c = T[lang];
  const root = document.getElementById("workshops");

  // clear timers on re-render
  while(carouselTimers.length) clearInterval(carouselTimers.pop());


  root.innerHTML = workshops.map((w,wi) => `
    <article class="ws ${w.accent==='green'?'green':''}">
      <div class="ws-carousel" data-carousel="${wi}">
        <div class="ws-slides">
          ${w.photos.map((p,i)=>`
            <div class="ws-slide ${i===0?'active':''}" data-slide="${i}">
              <img src="${p.src}" alt="${w.title[lang]} — ${p.credit}" loading="lazy" width="1024" height="768" />
              <div class="ws-credit">${p.credit}</div>
            </div>`).join("")}
        </div>
        <button class="ws-nav prev" data-dir="-1" aria-label="Previous photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="ws-nav next" data-dir="1" aria-label="Next photo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="ws-dots" aria-hidden="true">
          ${w.photos.map((_,i)=>`<span class="${i===0?'active':''}"></span>`).join("")}
        </div>
      </div>
      <div class="ws-body" tabindex="0">
        <h3 class="eyebrow ${w.accent==='green'?'green':''}">${w.title[lang]}</h3>
        <p class="preview">${w.body[lang].slice(0,120)}…</p>
        <span class="hint">${c.hoverHint}</span>
        <div class="ws-overlay">
          <h3 class="eyebrow ${w.accent==='green'?'green':''}">${w.title[lang]}</h3>
          <p>${w.body[lang]}</p>
          <a href="${w.link.href}" target="_blank" rel="noreferrer">${w.link.label}</a>
        </div>
      </div>
    </article>
  `).join("");

    // wire carousels
    document.querySelectorAll(".ws-carousel").forEach(car=>{
    const slides = car.querySelectorAll(".ws-slide");
    const dots = car.querySelectorAll(".ws-dots span");
    let idx = 0;
    const go = (n)=>{
      idx = (n + slides.length) % slides.length;
      slides.forEach((s,i)=>s.classList.toggle("active", i===idx));
      dots.forEach((d,i)=>d.classList.toggle("active", i===idx));
    };
    car.querySelectorAll(".ws-nav").forEach(btn=>{
      btn.addEventListener("click",()=>{
        go(idx + Number(btn.dataset.dir));
        resetTimer();
      });
    });
    let timer;
    const start=()=>{ timer = setInterval(()=>go(idx+1), 5000); carouselTimers.push(timer); };
    const resetTimer=()=>{ clearInterval(timer); start(); };
    start();
  });
}

function apply(){
  const c = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k = el.getAttribute("data-i18n");
    if (c[k] !== undefined) el.textContent = c[k];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{
    const k = el.getAttribute("data-i18n-html");
    if (c[k] !== undefined) el.innerHTML = c[k];
  });
  // intentions
  document.getElementById("intentions").innerHTML =
    c.intentionsList.map(li=>`<li>${li}</li>`).join("");
  document.getElementById("formatList").innerHTML =
    c.formatList.map(li=>`<li>${li}</li>`).join("");
  document.getElementById("great").innerHTML =
    c.great.map(p=>`<p>${p}</p>`).join("");
  renderWorkshops();
}

document.querySelectorAll(".lang button").forEach(b=>{
  b.addEventListener("click",()=>{
    lang = b.getAttribute("data-lang");
    document.querySelectorAll(".lang button").forEach(x=>x.classList.toggle("active", x===b));
    apply();
  });
});

// Modal
const modal = document.getElementById("impressumModal");
document.getElementById("openImpressum").addEventListener("click",()=>modal.classList.add("open"));
document.getElementById("closeImpressum").addEventListener("click",()=>modal.classList.remove("open"));
modal.addEventListener("click",e=>{ if(e.target===modal) modal.classList.remove("open"); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") modal.classList.remove("open"); });

apply();
</script>
